<!DOCTYPE html>
<html>
<head>
    <title>FitTrack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="home">
    <h1>FITTRACK</h1>
    <h2>Fitness & Food Tracker</h2>
        <p>Track your food and stay healthy.</p>
     <a href="#food">Start Tracking</a>
    </section>
 <section class="section">

    <h2>My Dashboard</h2>
     <div class="cards">
     <div>
          <h3>Daily Goal</h3>
          <p>Stay Healthy</p>
     </div>

     <div>
    <h3>Food</h3>
     <p id="mealCount">0 Meals</p>
    </div>

     <div>
    <h3>Protein</h3>
    <p>120g</p>
     </div>

     </div>

    </section>
 <!-- Food Tracker -->
 <section id="food" class="section">
<h2>Food Tracker</h2>
<div class="food">
 <div>

    <h3>Add Food</h3>
<input type="text" id="foodName" placeholder="Food Name">
 <input type="text" id="foodQty" placeholder="Quantity">
 <button id="addFoodBtn">Add Food</button>
 <p id="message"></p>
 <ul id="foodList"></ul>

 </div>


  </div>

 </section>


 <!-- About -->

 <section class="section about">

<h2>About FitTrack</h2>

  <p>
            FitTrack is a simple website for gym users
            to keep track of their daily food.
 </p>

</section>

<script src="script.js"></script>
</body>

</html>
